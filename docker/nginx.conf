# Serves the Angular app and proxies /api to the API, so the browser sees a single origin.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;

    # Behind another proxy (Caddy, Traefik...) take the real client address from X-Forwarded-For, so the API's
    # per-IP login limit isn't shared by every visitor. Only private-network senders are believed.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: ${TILE_ORIGIN}; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # Look the API up again every few seconds (Docker's DNS), so recreating only the API container doesn't leave a stale address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    # Hashed build assets never change; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
