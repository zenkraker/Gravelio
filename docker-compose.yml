# Copy .env.example to .env and set DB_PASSWORD, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gravelio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: gravelio
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravelio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies the EF migration bundle before the API starts.
  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: migrate }
    environment:
      ConnectionStrings__Default: Host=db;Database=gravelio;Username=gravelio
      # Npgsql reads the password from here, so a password with ; or = can't break the connection string.
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: api }
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Database=gravelio;Username=gravelio
      # Npgsql reads the password from here, so a password with ; or = can't break the connection string.
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Required: the first admin is never generated, because a generated password would end up in the logs.
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (12+ characters)}
      Admin__Email: ${ADMIN_EMAIL:-}
      # Set to false only to try Gravelio over plain http (browsers drop Secure cookies there).
      Auth__SecureCookies: ${SECURE_COOKIES:-true}
      # Per-IP login limit. Keep the default in production; the e2e job raises it for its many sign-ins.
      Auth__LoginAttemptsPerMinute: ${LOGIN_ATTEMPTS_PER_MINUTE:-10}
      # Telemetry is exported only when this is set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Optional outgoing email (password reset). Leave EMAIL_HOST/EMAIL_FROM unset to disable email.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Gravelio}
      Email__EnableSsl: ${EMAIL_SSL:-true}
    volumes:
      - api-keys:/keys
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
  # Login-cookie keys. Back it up with the database, but keep it separate: a database dump alone can't forge sessions.
  api-keys:
